<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8dfe9">
  <meta name="description" content="MARVEL STORE — أزياء وإكسسوارات مختارة بعناية.">
  <meta name="robots" content="index,follow">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://res.cloudinary.com">
  <link rel="preconnect" href="https://firebasedatabase.app">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>MARVEL STORE</title>
</head>
<body>
  <div id="toast-root" aria-live="polite"></div>
  <div id="app-loader" class="app-loader">
    <div class="loader-mark">M</div>
    <div class="loader-line"><span></span></div>
    <p>MARVEL STORE</p>
  </div>

  <header id="site-header" class="site-header">
    <div class="topbar">
      <button class="icon-btn mobile-only" id="mobile-menu-btn" aria-label="القائمة">☰</button>
      <a class="brand" href="#home" aria-label="MARVEL STORE">
        <span class="brand-m">M</span>
        <span class="brand-word">MARVEL</span>
        <small>STORE</small>
      </a>
      <div class="header-actions">
        <button class="icon-btn" id="search-btn" aria-label="بحث">⌕</button>
        <a class="icon-btn" href="#wishlist" aria-label="المفضلة">♡<b id="wish-count">0</b></a>
        <a class="icon-btn" href="#cart" aria-label="السلة">🛍<b id="cart-count">0</b></a>
      </div>
    </div>
    <nav id="main-nav" class="main-nav">
      <a href="#home">الرئيسية</a>
      <a href="#category/new">وصل حديثًا</a>
      <a href="#category/sale">العروض</a>
      <a href="#category/all">كل المنتجات</a>
    </nav>
  </header>

  <main id="view"></main>

  <footer class="site-footer">
    <div class="footer-grid">
      <div>
        <div class="footer-brand">MARVEL STORE</div>
        <p>اختياراتك. أسلوبك. عالمك.</p>
      </div>
      <div>
        <h3>تسوقي</h3>
        <a href="#category/all">كل المنتجات</a>
        <a href="#category/new">وصل حديثًا</a>
        <a href="#category/sale">العروض</a>
      </div>
      <div>
        <h3>تواصلي معنا</h3>
        <a id="footer-whatsapp" href="#" target="_blank" rel="noopener">WhatsApp</a>
        <a href="https://www.facebook.com/share/g/1DhEmrzqoq/" target="_blank" rel="noopener">مجتمع Marvel Store</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© <span id="year"></span> MARVEL STORE</span>
      <span>Made for a faster shopping experience.</span>
    </div>
  </footer>

  <a id="floating-whatsapp" class="floating-whatsapp" href="#" target="_blank" rel="noopener" aria-label="تواصل عبر واتساب">◉</a>

  <div id="search-drawer" class="overlay hidden">
    <div class="drawer">
      <button class="drawer-close" data-close-search>×</button>
      <div class="search-box">
        <span>⌕</span>
        <input id="search-input" type="search" placeholder="ابحثي عن فستان، شنطة، إكسسوار..." autocomplete="off">
      </div>
      <div id="search-results"></div>
    </div>
  </div>

  <script type="module" src="assets/js/app.js"></script>
  <script type="module" src="assets/js/sw-register.js"></script>
</body>
</html>
